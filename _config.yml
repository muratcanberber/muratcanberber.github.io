title: Murat Can Berber
description: Personal Portfolio & Blog
baseurl: ""
url: "https://muratcanberber.github.io"

# Theme settings
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

# Theme settings
title_separator: "|"
masthead_title: "IoT & Software Engineer"
search: true

# Author settings
author:
  name: Murat Can Berber
  email: your.email@example.com
  github: muratcanberber
  linkedin: your-linkedin-username

# Navigation
header_pages:
  - index.html
  - about.md
  - portfolio.md
  - blog.md

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
